name: Preflight

# Every PR is gated.  Deliberately no `paths:` filter: the fork's entire
# Preflight codebase lives under custom/**, and the pre-existing Linux/Custom
# workflows only trigger on src/** and test/**, so custom-only PRs used to run
# no build and no tests at all.
on:
  pull_request:
  push:
    branches:
      - custom-dev-next
      - custom-dev
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and static analysis
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so the changed-file diff against the base ref resolves.
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # setup-python does not provide pre-commit, and the qmllint/typos/shellcheck
      # hooks below run from it, so install it explicitly rather than relying on
      # a runner image happening to have it.
      - name: Install pre-commit
        run: python -m pip install --upgrade pre-commit

      - name: Cache pre-commit
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      # qmllint is a Qt binary; the hook skips itself when absent, so install it
      # explicitly rather than letting the QML gate silently no-op.
      - name: Install Qt (qmllint)
        uses: jurplel/install-qt-tool@v4
        with:
          version: 6.8.3
          packages: 'none'
          tools: 'qmllint'

      - name: Add qmllint to PATH
        run: |
          QMBIN=$(dirname "$(find "$HOME/Qt" -name qmllint -type f | head -1)")
          echo "$QMBIN" >> "$GITHUB_PATH"

      # Changed files only, deliberately.  The tree predates these gates (there
      # are ~200 typos and several pre-existing shellcheck findings), so an
      # --all-files run would be red on arrival and train everyone to ignore it.
      # Gating the diff means every new defect is caught while the backlog is
      # worked down separately.  Verify locally with:
      #   pre-commit run --all-files   # see the backlog
      #   pre-commit run --files $(git diff --name-only HEAD~1)
      - name: Run pre-commit on changed files
        run: |
          BASE=$(git merge-base HEAD "origin/${{ github.base_ref || 'master' }}")
          FILES=$(git diff --name-only --diff-filter=ACMR "$BASE" HEAD)
          if [ -z "$FILES" ]; then echo "no changed files to lint"; exit 0; fi
          echo "$FILES"
          pre-commit run --files $FILES --show-diff-on-failure

  clang-tidy:
    name: clang-tidy (changed C++ only)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install clang-tidy
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tidy-17
          sudo update-alternatives --install /usr/bin/clang-tidy clang-tidy \
            /usr/bin/clang-tidy-17 100

      # The whole tree predates this config and carries thousands of existing
      # diagnostics, so a full-tree run would be red on arrival and train people
      # to ignore it.  Gate the diff instead: every new diagnostic is caught,
      # and the backlog shrinks over time.
      - name: Collect changed C++ files
        id: changed
        run: |
          BASE=$(git merge-base HEAD origin/${{ github.base_ref || 'master' }})
          git diff --name-only --diff-filter=ACMR "$BASE" HEAD \
            | grep -E '\.(cpp|h)$' > files.txt || true
          wc -l < files.txt
          cat files.txt

      - name: Run clang-tidy
        run: |
          if [ ! -s files.txt ]; then echo "no C++ changes"; exit 0; fi
          # Without a configured build tree clang-tidy has no include paths and
          # every file is a parse-error wall, so this reports and warns only.
          clang-tidy -p /dev/null --quiet $(cat files.txt) 2>&1 | tee tidy.log || true
          if grep -qE "clang-diagnostic-error" tidy.log; then
            echo "::error::clang-tidy reported hard errors (see tidy.log)"
            grep -E "clang-diagnostic-error" tidy.log | head -20
            exit 1
          fi
          echo "no hard clang-tidy errors in changed files"

  test:
    name: Unit tests (custom build)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-tool@v4
        with:
          version: 6.8.3
          packages: 'qt6-base-dev qt6-declarative-dev libqt6svg6-dev'
          cache: true

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev libxext-dev libxrandr-dev libxinerama-dev \
            libxtst-dev libxkbcommon-x11-0 libgl1-mesa-dev \
            libglu1-mesa-dev cmake ninja-build git

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DQGC_BUILD_TESTING=ON

      - name: Build
        run: cmake --build build --target PreflightQGroundControl -j$(nproc)

      # Gate: run each registered test in its OWN process via CTest.
      #
      # A single `PreflightQGroundControl --unittest` process is NOT usable as a
      # gate for this tree: the QML smoke tests deliberately leak engines and
      # windows to dodge a Qt 6 AOT teardown crash, and MockLink binds fixed UDP
      # ports, so test order matters and later cases crash or hang on state the
      # earlier ones corrupted (observed: ReturnToLaunchTest segfaults only when
      # run after other classes, and passes 9/9 alone).  Per-class processes make
      # the result deterministic.
      #
      # timeout-minutes matters too: a crashing test leaves the process (plus its
      # crash-handler gdb attach) alive holding those ports, which makes later
      # runs hang rather than report the real failure.
      #
      # EXCLUDED below are five stock upstream tests that already fail in this
      # fork before any change here.  They were invisible until enable_testing()
      # was added, because `ctest` previously reported "Total Tests: 0".
      # Remove an entry once it is fixed - do not add new ones.
      - name: Run ctest
        working-directory: build
        timeout-minutes: 45
        run: |
          ctest --output-on-failure \
            -E '^(GpsTest|CorridorScanComplexItemTest|MissionControllerTest|SimpleMissionItemTest|SurveyComplexItemTest)$'
